name: Crawl table index

on:
  workflow_dispatch:
    inputs:
      sources:
        description: Sources to crawl, separated by spaces, or "all"
        default: all
        required: true
      langs:
        description: Languages to crawl, separated by spaces (empty for all)
        default: ''
        required: false
      upload:
        description: Upload the snapshots to R2 (off = dry run)
        type: boolean
        default: false
      force:
        description: Write snapshots that fail the count check
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm --filter statsmcp-crawler build
      # "Re-run failed jobs" resumes from the checkpoints of the failed attempt.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/crawler/.crawl
          key: crawl-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: crawl-${{ github.run_id }}-
      - name: Crawl
        working-directory: apps/crawler
        env:
          SOURCES: ${{ inputs.sources }}
          LANGS: ${{ inputs.langs }}
          FORCE: ${{ inputs.force }}
        run: |
          set -f
          args=()
          for source in $SOURCES; do args+=(--source "$source"); done
          for lang in $LANGS; do args+=(--lang "$lang"); done
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          node dist/cli.js "${args[@]}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: failure()
        with:
          path: apps/crawler/.crawl
          key: crawl-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snapshots
          path: apps/crawler/out
          if-no-files-found: ignore
      - name: Upload to R2
        if: inputs.upload
        working-directory: apps/crawler/out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mapfile -t keys < <(find index -name '*.json.gz' | sort)
          if [ "${#keys[@]}" -eq 0 ]; then echo "No snapshots to upload."; exit 1; fi
          for key in "${keys[@]}"; do
            pnpm --filter statsmcp-worker exec wrangler r2 object put "statsmcp-index/$key" \
              --file "$PWD/$key" --content-type application/gzip --remote < /dev/null
          done

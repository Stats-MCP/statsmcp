name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm -r --filter './packages/*' exec pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/pack/*.tgz

  smoke:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: pack
      - name: Install the packed packages
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund pack/*.tgz
      - name: Start sistat-mcp and list its tools
        run: |
          {
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 10
          } | timeout 60 ./node_modules/.bin/sistat-mcp > out.jsonl
          cat out.jsonl
          grep -q '"query_table"' out.jsonl

  types:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: pack
      - name: Check package types resolution
        run: |
          for tarball in pack/*.tgz; do
            npx -y @arethetypeswrong/cli@0.18.5 --profile esm-only "$tarball"
          done
      - name: Typecheck a TypeScript 5 consumer
        working-directory: tests/consumer
        run: |
          npm init -y > /dev/null
          npm pkg set type=module
          npm install --no-audit --no-fund ../../pack/*.tgz typescript@5.9.3 @types/node@20.19.43
          npx tsc -p .
